<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>人生事件・政府挺你V3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC",Arial,sans-serif;
  background:#ffffff;min-height:100vh;display:flex;
  align-items:center;justify-content:center;padding:24px 12px;color:#2b2b2b}
.stagehint{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:#a12b5e;font-weight:700;font-size:14.5px;letter-spacing:.05em}
/* phone */
.phone{width:390px;max-width:100%;height:800px;max-height:92vh;background:#FDEAF1;border-radius:44px;
  box-shadow:0 30px 70px rgba(0,0,0,.45),0 0 0 12px #10151f,0 0 0 14px #2a3242;position:relative;overflow:hidden;display:flex;flex-direction:column}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:26px;background:#10151f;border-radius:0 0 18px 18px;z-index:30}
.statusbar{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:14px;font-weight:700;color:#3a3a35;flex:none}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{width:0}
.pad{padding:6px 18px 20px}
/* top bar */
.appbar{display:flex;align-items:center;gap:10px;padding:6px 18px 10px;flex:none}
.appbar .back{appearance:none;border:none;background:#fff;border:1px solid #e9e1c4;border-radius:10px;width:34px;height:34px;font-size:17.5px;cursor:pointer;color:#1F497D}
.appbar .t{font-size:17.5px;font-weight:800;color:#1F497D}
.appbar .sp{margin-left:auto}
.miniuser{font-size:13px;font-weight:700;color:#4e9c3a;background:#e6f3df;border-radius:20px;padding:3px 10px}
.miniuser.out{color:#8a6a00;background:#fff3d6}

.brand{padding:8px 2px 2px}
.brand .ey{font-size:13px;letter-spacing:.16em;color:#1F497D;font-weight:800}
.brand h1{font-size:28.5px;font-weight:900;color:#2b2b2b;margin-top:4px;line-height:1.2}
.brand .u{height:6px;width:70px;background:#FFC000;border-radius:3px;margin-top:8px}
.brand p{margin-top:12px;color:#6b6b66;font-size:15px}

.evgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.evcard{position:relative;appearance:none;cursor:pointer;border:none;border-radius:18px;
  padding:16px 12px 14px;text-align:center;transition:.15s;overflow:hidden}
.evcard:active{transform:scale(.97)}
.evcard .emo{width:54px;height:54px;border-radius:50%;background:#fff;margin:0 auto;
  display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.evcard .emo img{height:32px;width:auto;display:block}
.brand .biglogo{display:block;height:38px;width:auto;margin-bottom:14px}
.appbar .logom{height:30px;width:auto;display:block}
.evcard .nm{font-size:16.5px;font-weight:900;margin-top:10px}
.evcard .ds{font-size:11.5px;color:#7d7d75;margin-top:3px}
.evcard .soonpill{position:absolute;top:9px;right:9px;font-size:10px;font-weight:800;
  padding:2px 8px;border-radius:20px;background:#fff;color:#9a9a90;box-shadow:0 1px 4px rgba(0,0,0,.1)}
/* 事件色彩編碼（出生藍・幼兒園綠・結婚粉・創業金） */
.ev-birth{background:#fff;border:2px solid #3E86C9} .ev-birth .nm{color:#3E86C9} .ev-birth .emo{box-shadow:0 0 0 2px #3E86C9 inset,0 3px 10px rgba(0,0,0,.08)}
.ev-kg{background:#fff;border:2px solid #4E9C3A} .ev-kg .nm{color:#4E9C3A} .ev-kg .emo{box-shadow:0 0 0 2px #4E9C3A inset,0 3px 10px rgba(0,0,0,.08)}
.ev-marry{background:#fff;border:2px solid #D6558A} .ev-marry .nm{color:#D6558A} .ev-marry .emo{box-shadow:0 0 0 2px #D6558A inset,0 3px 10px rgba(0,0,0,.08)}
.ev-startup{background:#fff;border:2px solid #E0A100} .ev-startup .nm{color:#E0A100} .ev-startup .emo{box-shadow:0 0 0 2px #E0A100 inset,0 3px 10px rgba(0,0,0,.08)}
.homecta{margin-top:16px;background:#fff;border:1px dashed #d8cfa8;border-radius:14px;padding:13px 15px;display:flex;align-items:center;gap:12px}
.homecta .ic{font-size:23.5px}
.homecta .tx{font-size:14px;color:#6b6b66;flex:1}
.homecta b{color:#1F497D}

/* wizard */
.qwrap{margin-top:10px}
.qstep{font-size:13.5px;font-weight:800;color:#1F497D;letter-spacing:.05em}
.qtitle{font-size:21.5px;font-weight:800;margin:6px 0 4px}
.qsub{font-size:14px;color:#8a8a80;margin-bottom:14px}
.ctys{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cbtn{appearance:none;cursor:pointer;border:1.5px solid #e9e1c4;background:#fff;border-radius:11px;padding:12px 4px;
  font-family:inherit;font-size:16px;font-weight:700;color:#2b2b2b;position:relative}
.cbtn:active{transform:scale(.96)}
.cbtn[aria-pressed="true"]{background:#FFC000;border-color:#FFC000;color:#3a2f00}
.cbtn .d{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%}
.opts{display:flex;flex-direction:column;gap:10px}
.obtn{appearance:none;cursor:pointer;text-align:left;border:1.5px solid #e9e1c4;background:#fff;border-radius:13px;
  padding:15px 16px;font-family:inherit;font-size:17px;font-weight:700;color:#2b2b2b;display:flex;align-items:center;gap:10px}
.obtn:active{transform:scale(.98)} .obtn .em{font-size:21.5px}
.s-online{background:#FFC000}.s-partial{display:none}.s-offline{display:none}
.nextbar{margin-top:16px;display:flex;gap:10px}
.pbtn{flex:1;appearance:none;cursor:pointer;border:none;border-radius:12px;padding:14px;font-family:inherit;font-size:17px;font-weight:800}
.pbtn.primary{background:#1F497D;color:#fff}.pbtn.primary:disabled{background:#b9c2ce}
.pbtn.ghost{background:#fff;border:1.5px solid #e9e1c4;color:#1F497D;flex:none;width:64px}

/* flow */
.flowtop{background:#1F497D;color:#fff;border-radius:16px;padding:14px 16px;margin-top:6px}
.flowtop .ev{font-size:13.5px;font-weight:700;opacity:.85}
.flowtop .ct{font-size:22.5px;font-weight:900;margin-top:2px}
.flowtop .echo{margin-top:7px;font-size:13.5px;background:rgba(255,255,255,.16);display:inline-block;padding:3px 10px;border-radius:20px}
.olead{margin:12px 0 2px;font-size:14px;color:#4e9c3a;font-weight:800;display:flex;align-items:center;gap:6px}
.ftools{display:flex;justify-content:flex-end;margin:8px 0 2px}
.expbtn{appearance:none;cursor:pointer;background:#fff;border:1.5px solid #e9d5e0;color:#a12b5e;font-family:inherit;font-weight:800;font-size:14px;border-radius:20px;padding:6px 14px}
.acclbl{font-size:14px;color:#8a8a80;font-weight:700;margin-top:6px}
.accmail{font-size:20.5px;font-weight:800;color:#1F497D;background:#eef4fb;border:1px solid #d5e2f2;border-radius:11px;padding:13px 15px;margin:6px 0 14px;word-break:break-all}
.acc{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.st{background:#fff;border:1px solid #e9e1c4;border-radius:14px;overflow:hidden;border-left:5px solid #ddd}
.st.k-online{border-left-color:#FFC000}.st.k-partial{border-left-color:#FFC000}.st.k-offline{border-left-color:#FFC000}.st.k-none{border-left-color:#c9c2a8}
.sth{width:100%;appearance:none;border:none;background:transparent;cursor:pointer;font-family:inherit;text-align:left;padding:13px 14px;display:flex;align-items:center;gap:11px}
.snum{flex:none;width:28px;height:28px;border-radius:50%;background:#FFC000;border:2px solid #E0A100;color:#000;font-weight:800;font-size:15.5px;display:flex;align-items:center;justify-content:center}
.st.local .snum{background:#FFC000;border-color:#E0A100;color:#000}.st.common .snum{background:transparent;border:2px solid #2b2b2b;color:#2b2b2b}
.stt{flex:1;min-width:0}
.stt .nm{font-size:16.5px;font-weight:800;line-height:1.3}
.stt .hn{font-size:13px;margin-top:2px}
.way{font-weight:800;padding:1px 7px;border-radius:6px;font-size:12.5px}
.way.on{background:#e6f3df;color:#4e9c3a}.way.off{background:#faf1d8;color:#8a6a00}
.chev{flex:none;color:#c3b98f;transition:transform .2s}
.st.open .chev{transform:rotate(90deg)}
.stb{display:none;padding:0 14px 14px 53px}
.st.open .stb{display:block}
.amount{background:#fff4f2;border:1px solid #ffd9d2;border-radius:9px;padding:8px 11px;margin:2px 0 8px;font-size:15.5px;color:#5b1f17}
.amount b{color:#c0392b}
.rows{display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
.r{display:grid;grid-template-columns:48px 1fr;gap:8px;font-size:14px}.r .k{color:#8a8a80;font-weight:700}
.chan{border-radius:10px;padding:9px 11px;font-size:14.5px;margin-top:7px}
.chan.on{background:#e6f3df;border:1px solid #bfe0b0}.chan.off{background:#faf6e8;border:1px solid #e9e1c4}
.chan .lbl{font-size:13px;font-weight:800;margin-bottom:2px}.chan.on .lbl{color:#4e9c3a}.chan.off .lbl{color:#8a6a00}
.btn{display:inline-block;margin-top:8px;background:#1F497D;color:#fff;text-decoration:none;font-weight:800;font-size:15px;padding:9px 15px;border-radius:9px}
.counterbtn{margin-top:8px;appearance:none;cursor:pointer;background:#fff;border:1.5px dashed #d8b96a;color:#8a6a00;font-family:inherit;font-weight:800;font-size:14px;border-radius:9px;padding:8px 12px;width:100%}
.combo{margin-top:8px;background:#e6f3df;border:1px solid #bfe0b0;border-radius:10px;padding:9px 11px}
.combo .l{font-size:12.5px;font-weight:800;color:#4e9c3a}.combo .n{font-size:15px;font-weight:800;margin-top:1px}
.combo .citem{margin-top:9px;padding-top:9px;border-top:1px dashed #bfe0b0}
.combo .citem:first-of-type{margin-top:4px;padding-top:0;border-top:0}
.combo-detail{background:#fff;border-radius:10px;padding:10px 12px;margin-top:8px;border:1px solid #cce8c1;box-shadow:0 2px 5px rgba(0,0,0,0.03);}
.combo .cm{font-size:13.5px;margin-top:2px}
.combo .cd{font-size:13.5px;color:#8a8a80;margin-top:2px}
.combo .calt{margin-top:5px;background:#fff;border:1px dashed #bfe0b0;border-radius:8px;padding:5px 8px;font-size:12.5px;color:#6b6b66}
.combo .chn{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:6px;background:#fff;border:1px solid #bfe0b0;color:#4e9c3a}
.combo .chn.lim{background:#fff3d6;border-color:#e6cf88;color:#8a6a00}
.exc{margin-top:8px;background:#fdeeee;border:1px solid #f3cfcf;border-radius:9px;padding:8px 11px}
.exc .l{font-size:13px;font-weight:800;color:#e0553d;margin-bottom:2px}.exc ul{margin:0;padding-left:17px}.exc li{font-size:13.5px;color:#7a3b2f;margin:2px 0}
.tip{margin-top:8px;font-size:13.5px;color:#7a6a3a;background:#fff8e6;border:1px dashed #e6cf88;border-radius:8px;padding:6px 9px}
.trackbtn{margin-top:10px;appearance:none;cursor:pointer;width:100%;border-radius:10px;padding:10px;font-family:inherit;font-weight:800;font-size:14.5px;border:1.5px solid #1F497D;background:#fff;color:#1F497D}
.trackbtn.added{background:#1F497D;border-color:#1F497D;color:#fff}

/* login */
.lwrap{margin-top:14px}
.lcard{background:#fff;border:1px solid #e9e1c4;border-radius:16px;padding:18px}
.lcard h2{font-size:20.5px;font-weight:800}
.lcard p{font-size:14px;color:#8a8a80;margin-top:5px}
.inp{width:100%;margin-top:12px;border:1.5px solid #e9e1c4;border-radius:11px;padding:13px;font-family:inherit;font-size:16.5px;outline:none}
.inp:focus{border-color:#1F497D}
.mail{margin-top:14px;background:#eef4fb;border:1px solid #cddcf0;border-radius:12px;padding:13px 14px}
.mail .mh{font-size:13.5px;font-weight:800;color:#1F497D;display:flex;align-items:center;gap:6px}
.mail .code{font-size:31.5px;font-weight:900;letter-spacing:8px;color:#1F497D;text-align:center;margin:8px 0}
.mail .lk{font-size:14px}
.mutelink{display:block;text-align:center;margin-top:12px;font-size:14px;color:#1F497D;font-weight:700;cursor:pointer;text-decoration:underline;background:none;border:none;width:100%}

/* tracker */
.trk{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.trkitem{background:#fff;border:1px solid #e9e1c4;border-radius:13px;padding:12px 14px}
.trkitem .ctx{font-size:12.5px;color:#8a8a80;font-weight:700}
.trkitem .ti{font-size:16px;font-weight:800;margin-top:2px}
.trkitem .bot{display:flex;align-items:center;gap:8px;margin-top:9px}
.stpill{appearance:none;cursor:pointer;border:none;font-family:inherit;font-weight:800;font-size:13.5px;border-radius:20px;padding:5px 12px}
.stp-todo{background:#f0ecdb;color:#8a8a80}.stp-doing{background:#dbeafe;color:#1F497D}.stp-done{background:#e6f3df;color:#4e9c3a}
.rm{margin-left:auto;background:none;border:none;color:#c98;font-size:13.5px;cursor:pointer;font-weight:700}
.empty{text-align:center;color:#8a8a80;font-size:15.5px;padding:40px 16px;border:1.5px dashed #e0d8ba;border-radius:14px;margin-top:10px}

/* toast + bottom nav */
.toast{position:absolute;bottom:78px;left:50%;transform:translateX(-50%) translateY(20px);background:#2b2b2b;color:#fff;
  font-size:14.5px;font-weight:700;padding:10px 18px;border-radius:22px;opacity:0;transition:.25s;z-index:40;pointer-events:none;white-space:nowrap}
.toast.on{opacity:.96;transform:translateX(-50%) translateY(0)}
.nav{flex:none;display:flex;background:#fff;border-top:1px solid #eee}
.nav button{flex:1;appearance:none;border:none;background:none;cursor:pointer;font-family:inherit;padding:9px 0 12px;color:#9a9a90;font-size:12.5px;font-weight:700}
.nav button .i{font-size:21.5px;display:block;margin-bottom:1px}
.nav button[aria-current="true"]{color:#1F497D}
.cmp{margin:10px 0 2px;border:1px solid #e3ddc4;border-radius:12px;overflow:hidden;background:#fff}
.cmp>summary{cursor:pointer;list-style:none;padding:11px 14px;font-size:15px;font-weight:800;color:#1F497D;background:#eef4fb}
.cmp>summary::-webkit-details-marker{display:none}
.cmp .cbody{padding:6px 14px 12px}
.cmp-row{padding:8px 0;border-bottom:1px dashed #eadfbc}
.cmp-row:last-child{border-bottom:none}
.cmp-face{font-size:13.5px;font-weight:800;color:#555;margin-bottom:3px}
.cmp-a,.cmp-b{font-size:14px;margin:2px 0;line-height:1.5}
.tg{font-weight:800;font-size:12px;border-radius:5px;padding:1px 6px;margin-right:6px}
.tg.pub{background:#e6f3df;color:#4e9c3a}.tg.np{background:#fff3d6;color:#8a6a00}
.cmn{font-size:13px;color:#8a6a3a;margin-top:9px;background:#fff8e6;border-radius:8px;padding:6px 9px}

.qhint{font-size:14px;color:#8a8a80;margin:-4px 0 14px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:10px}
.obtn{text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid #e3e0d8;background:#fff;font-size:16px;cursor:pointer;font-family:inherit}
.obtn.sel{border-color:#b3591e;background:#fdf3ec;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px;align-items:center}
.chip{font-size:12.5px;background:#f1efe9;border-radius:999px;padding:4px 10px;color:#6a6a60;font-weight:600}
.redo{font-size:13px;color:#0056b3;text-decoration:underline;background:none;border:none;cursor:pointer;padding:2px 4px;font-family:inherit}
.flowlead{font-size:16.5px;color:#000;margin:0 2px 10px;line-height:1.5}
.skipbox{margin-top:16px;background:#faf8f2;border:1px dashed #d8d4c8;border-radius:14px;padding:12px 14px}
.skipbox .h{font-weight:700;font-size:14px;margin-bottom:6px;color:#7a7a70}
.skipbox .it{font-size:13.5px;color:#8a8a80;margin:5px 0;line-height:1.55}
.skipbox .it b{color:#5a5a52}

/* ===== V6 辦理清單 ===== */
.addlist{margin:16px 0 4px;appearance:none;cursor:pointer;width:100%;border-radius:12px;padding:14px;font-family:inherit;font-weight:800;font-size:15.5px;border:none;background:#1F497D;color:#fff;box-shadow:0 6px 16px rgba(31,73,125,.25)}
.addlist:active{transform:scale(.98)}
/* 勾選清單 item 狀態底色 */
.chkrow{display:flex;align-items:center}
.chk{flex:none;padding:0 4px 0 12px;cursor:pointer;display:flex;align-items:center}
.chk input{width:22px;height:22px;accent-color:#4e9c3a;cursor:pointer;margin:0}
.chksth{padding-left:8px}
.st.vw{background:#FFF6D4;border-color:#EFDD9C}
.st.dn{background:#E7F4DE;border-color:#C5E3B5}
.st.dn .stt .nm{color:#3f7f2f}
/* checklist 標頭與進度 */
.clhead{background:#1F497D;color:#fff;border-radius:16px;padding:14px 16px;margin-top:6px}
.clhead .ev{font-size:18.5px;font-weight:900}
.clhead .ct{font-size:13.5px;opacity:.85;margin-top:2px}
.clprog{margin:12px 2px}
.clprog .t{font-size:13.5px;color:#6a6a60;font-weight:800;margin-bottom:6px}
.clbarwrap{height:10px;background:#eceae2;border-radius:6px;overflow:hidden}
.clbar{height:100%;background:#4e9c3a;border-radius:6px;transition:width .3s}
.clhint{font-size:13px;color:#9a9a90;margin:0 2px 10px;line-height:1.5}
/* 清單卡 */
.lcards{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.lcard2{background:#fff;border:1px solid #e9e1c4;border-radius:14px;padding:14px;cursor:pointer;position:relative;transition:.15s;box-shadow:0 4px 12px rgba(31,73,125,.05)}
.lcard2:active{transform:scale(.99)}
.lcard2 .row1{display:flex;align-items:center;gap:10px}
.lcard2 .ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.lcard2 .ic img{height:24px;width:auto}
.lc-birth .ic{background:#EAF3FC}.lc-kg .ic{background:#EAF6E4}
.lcard2 .nm{font-size:16.5px;font-weight:800}
.lcard2 .sub{font-size:12.5px;color:#8a8a80;margin-top:1px}
.lcard2 .pbar{height:8px;background:#eceae2;border-radius:5px;overflow:hidden;margin-top:11px}
.lcard2 .pfill{height:100%;background:#4e9c3a;border-radius:5px}
.lcard2 .pt{font-size:12.5px;color:#6a6a60;font-weight:700;margin-top:6px;display:flex;justify-content:space-between;align-items:center}
.lcard2 .done-badge{background:#e6f3df;color:#4e9c3a;font-weight:800;border-radius:20px;padding:2px 10px;font-size:12px}
.lcard2 .rm2{position:absolute;top:11px;right:12px;background:none;border:none;color:#c89;font-size:12.5px;cursor:pointer;font-weight:700}
/* 恭喜浮層 */
.congrats{position:absolute;inset:0;background:rgba(18,24,40,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:26px}
.cgbox{background:#fff;border-radius:22px;padding:20px;text-align:center;max-width:300px;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:cgpop .32s ease}
@keyframes cgpop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.cgbox img{width:100%;max-width:230px;border-radius:14px;display:block;margin:0 auto}
.cgbox h3{font-size:21px;font-weight:900;color:#1F497D;margin-top:14px}
.cgbox p{font-size:14px;color:#6a6a60;margin-top:6px;line-height:1.5}
.cgbox .pbtn{margin-top:16px}

/* ===== 真手機／觸控裝置：全螢幕呈現（電腦滑鼠環境維持手機示意外框） ===== */
@media (hover:none) and (pointer:coarse){
  body{display:block;margin:0;padding:0;min-height:100dvh;background:#FDEAF1}
  .stagehint,.notch,.statusbar{display:none}
  .phone{width:100vw;max-width:none;height:100dvh;max-height:none;border-radius:0;box-shadow:none;padding-top:env(safe-area-inset-top)}
  .nav{padding-bottom:env(safe-area-inset-bottom)}
}
</style>

const LBL={ins:{labor:'勞保',np:'國保',farm:'農保',civil:'公保',none:'無投保'},mil:{y:'軍眷',n:''},abo:{y:'原住民',n:''},
  settle:{0:'設籍<6月',6:'設籍6-10月',10:'設籍10-12月',12:'設籍1年+'},care:{send:'送托',self:'自己帶'},

  got:{y:'已領0-2津貼',n:''},dev:{y:'早療',maybe:'擬評估',n:''}};
const WFL={low:'低收',lowmid:'中低收',special:'特境',dis:'身障',abo:'原住民',none:''};
function answerChips(a){
  const out=[];
  Object.keys(a).forEach(k=>{
    if(k==='county')return;
    if(k==='wf'){(a.wf||[]).forEach(x=>{if(WFL[x])out.push(WFL[x]);});return;}

}

function chanHTML(s,i){

  let h='';

    h+=`<div class="chan on"><div class="lbl">🖥️ 線上辦理${off?'（最方便）':''}</div>${esc(o.平台||'可線上申辦')}${o.憑證?`（${esc(o.憑證)}）`:''}`

  }
  if(off){
    const c=s.臨櫃, docs=(c.應備文件||[]).map(esc).join('、');
    const inner=`<div class="chan off" id="ct${i}" ${on?'style="display:none"':''}><div class="lbl">🏢 臨櫃／現場</div>`
      +(loc?`地點：${esc(loc)}`:'')+(docs?`<br>應備：${docs}`:'')+(c.說明頁?`<br><a class="btn" href="${esc(c.說明頁)}" target="_blank" rel="noopener">前往說明頁面 ↗</a>`:'')+`</div>`;

/* 移除對民眾多餘的內部盤點註記（原盤點…更正…補列…），保留對民眾有用的內容 */
function cleanNote(t){
  if(!t) return '';
  const AUDIT=/原盤點|補列|補回|已更新|已更正|更正為|已移除|已加註|已補正|已下修|已升級|已過時|高估|查無|回傳|改用|改指向|入口更新|失效|勿與|確認無|原URL|疑與|未反映|標註為|已標註|原「|舊制/;
  if(!AUDIT.test(t)) return t;
  const parts=t.split(/[。；]/).map(x=>x.trim()).filter(x=>x && !AUDIT.test(x));
  return parts.length ? parts.join('。')+'。' : '';
}
function stepBody(s,i){
  let fmtAmt = a => a ? esc(a).replace(/[、，](第\d+[名胎]|雙胞胎|三胞胎|多胞胎|首胎|二胎|三胎|四胎|五胎)/g, '<br>$1').replace(/；/g, '<br>').replace(/：/g, '：<br>') : '';
  let p='';
  if(s.金額)p+=`<div class="amount">${fmtAmt(s.金額)}</div>`;
  if(s.desc)p+=`<div style="font-size:14px;color:#8a8a80;margin-bottom:6px">${s.desc}</div>`;
  let rr=''; if(s.資格)rr+=`<div class="r"><span class="k">資格</span><span>${esc(s.資格)}</span></div>`;
  if(s.申請期限)rr+=`<div class="r"><span class="k">期限</span><span>${esc(s.申請期限)}</span></div>`;
  if(rr)p+=`<div class="rows">${rr}</div>`;
  p+=chanHTML(s,i);
  if(s.combos&&s.combos.length)p+=`<div class="combo"><div class="l">${esc(s.comboLabel||("➕ 辦出生登記時可一站式併辦下列 "+s.combos.length+" 項（同一窗口／同一線上流程）"))}</div>`
    +s.combos.map(cb=>`<div class="citem"><details><summary class="n" style="cursor:pointer;list-style:none;">${esc(cb.title)}${cb.chn?`<span class="chn${cb.chn.includes('僅臨櫃')?' lim':''}">${esc(cb.chn)}</span>`:''}</summary><div class="combo-detail">`
      +(cb.金額?`<div class="cm" style="margin-top:0">${fmtAmt(cb.金額)}</div>`:'')
      +(cb.text?`<div class="cd">${esc(cb.text)}</div>`:'')
      +(cb.exc&&cb.exc.length?`<div class="exc"><div class="l">⚠️ 下列情形無法併辦，須另外辦理：</div><ul>${cb.exc.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`:'')
      +(cb.alt?`<div class="calt">🔁 ${esc(cb.alt)}</div>`:'')
      +`</div></details></div>`).join('')+`</div>`;
  {const tp=cleanNote(s.tip); if(tp)p+=`<div class="tip">💡 ${esc(tp)}</div>`;}
  return p;
}

  return `<div class="flowtop"><div class="ev">${evName}</div><div class="ct">${esc(state.county||'')}</div></div>
    <div class="chips">${answerChips(a)}<button class="redo" onclick="state.qi=0;go('wizard')">✎ 重新回答</button></div>
    <div class="flowlead">依您的回答整理建議申辦清單與順序如下：</div>
    <div class="ftools"><button class="expbtn" onclick="toggleAll(this)">▽ 展開全部</button></div>
    <div class="acc">${r.S.map((s,i)=>stepHTML(s,i)).join('')}</div>
    <button class="addlist" onclick="addEventToList()">＋ 加入辦理清單</button>
    ${r.skipped.length?`<div class="skipbox"><div class="h">ℹ️ 未列入的項目（原因）</div>${r.skipped.map(x=>`<div class="it">・<b>${esc(x.t)}</b>：${esc(x.r)}</div>`).join('')}</div>`:''}`;
}
function toggleAll(btn){
  const items=document.querySelectorAll('.acc .st');
  const anyClosed=[...items].some(it=>!it.classList.contains('open'));
  items.forEach(it=>it.classList.toggle('open',anyClosed));
  btn.textContent=anyClosed?'△ 收合全部':'▽ 展開全部';
}
/* ===== 辦理清單（以人生事件為單位） ===== */
function genSteps(ev,county,ans){return ev==='birth'?birthSteps(county,ans):kgSteps(county,ans);}
function addEventToList(){
  if(!store.user){pendingAdd=true;toast('請先登入才能加入辦理清單');go('login');return;}
  const ev=state.ev, county=state.county;
  const ans=JSON.parse(JSON.stringify((state.ans||{})[ev]||{}));
  const L=store.lists;
  L.push({id:'L'+Date.now()+Math.floor(Math.random()*1000),ev,county,ans,checks:{},viewed:{}});
  store.lists=L;
  toast('已加入辦理清單 ✓');
  go('tracker');
}
function curEntry(){return store.lists.find(x=>x.id===state.activeList);}
function saveEntry(e){const L=store.lists;const i=L.findIndex(x=>x.id===e.id);if(i>=0){L[i]=e;store.lists=L;}}
function toggleStep(i,btn){
  const stEl=btn.closest('.st');stEl.classList.toggle('open');
  const e=curEntry();if(e&&!e.viewed[i]){e.viewed[i]=true;saveEntry(e);if(!stEl.classList.contains('dn'))stEl.classList.add('vw');}
}
function toggleCheck(i,inp){
  const e=curEntry();if(!e)return;const stEl=inp.closest('.st');
  if(inp.checked){e.checks[i]=true;stEl.classList.add('dn');stEl.classList.remove('vw');}
  else{delete e.checks[i];delete e.viewed[i];stEl.classList.remove('dn');stEl.classList.remove('vw');}
  saveEntry(e);updateProgress();
  if(inp.checked&&allDone(e))setTimeout(showCongrats,260);
}
function allDone(e){const r=genSteps(e.ev,e.county,e.ans);return r.S.length>0&&r.S.every((s,i)=>e.checks[i]);}
function updateProgress(){
  const e=curEntry();if(!e)return;const r=genSteps(e.ev,e.county,e.ans);
  const total=r.S.length,done=r.S.filter((s,i)=>e.checks[i]).length;
  const t=document.getElementById('clProg');if(t)t.textContent='已完成 '+done+'／'+total+' 項';
  const b=document.getElementById('clBar');if(b)b.style.width=(total?Math.round(done/total*100):0)+'%';
}
function showCongrats(){
  if(document.getElementById('congrats'))return;
  const ov=document.createElement('div');ov.id='congrats';ov.className='congrats';
  ov.innerHTML='<div class="cgbox"><img src="congragulations.png" alt="恭喜完成"><h3>🎉 恭喜完成！</h3><p>你已完成這個人生事件的所有辦理項目，太厲害了！</p><button class="pbtn primary" onclick="closeCongrats()">太棒了</button></div>';
  document.querySelector('.phone').appendChild(ov);
}
function closeCongrats(){const el=document.getElementById('congrats');if(el)el.remove();}

/* login (passwordless) */
function scrLogin(){
  return `<div class="lwrap"><div class="lcard"><h2>用 Email 登入</h2>
    <p>人生大事偶爾才遇到，不用記密碼。輸入 Email，我們寄一組登入碼／登入連結給你即可。</p>
    <input class="inp" id="email" type="email" placeholder="你的 Email，例如 you@example.com" value="${esc(store._draft||'')}">
    <div class="nextbar"><button class="pbtn primary" onclick="sendCode()">寄送登入碼</button></div>
    <div id="mailbox"></div>
  </div></div>`;
}
function sendCode(){
  const em=document.getElementById('email').value.trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){toast('請輸入正確的 Email');return;}
  store._draft=em;
  pendingCode={email:em,code:String(Math.floor(100000+Math.random()*900000))};
  document.getElementById('mailbox').innerHTML=`
    <div class="mail"><div class="mh">📩 示範模式：這封信會寄到 ${esc(em)}</div>
      <div class="code">${pendingCode.code}</div>
      <input class="inp" id="codein" inputmode="numeric" maxlength="6" placeholder="輸入 6 位數登入碼">
      <div class="nextbar"><button class="pbtn primary" onclick="verifyCode()">登入</button></div>
      <button class="mutelink" onclick="magicLogin()">🔗 或：點我模擬點擊信中的「登入連結」直接登入</button>
    </div>`;
}
function finishLogin(){
  store.user=pendingCode.email; store._draft='';
  toast('登入成功 ✓');
  if(pendingAdd){pendingAdd=false;addEventToList();return;}
  else go('tracker');
}
function verifyCode(){const v=(document.getElementById('codein').value||'').trim();
  if(v!==pendingCode.code){toast('登入碼不正確');return;} finishLogin();}
function magicLogin(){finishLogin();}

/* tracker（辦理清單一覽） */
function openList(id){
  const e=store.lists.find(x=>x.id===id);if(!e){toast('清單不存在');return;}
  state.activeList=id;state.ev=e.ev;state.county=e.county;
  state.ans=state.ans||{};state.ans[e.ev]=JSON.parse(JSON.stringify(e.ans));
  go('checklist');
}
function rmList(id){const L=store.lists.filter(x=>x.id!==id);store.lists=L;render();toast('已刪除');}
function scrTracker(){
  if(!store.user) return `<div class="lwrap"><div class="empty">登入後即可建立並追蹤辦理清單。<br><br>
    <button class="pbtn primary" style="max-width:180px;margin:0 auto" onclick="go('login')">前往登入</button></div></div>`;
  const L=store.lists;
  if(!L.length) return `<div class="empty">還沒有辦理清單。<br>在事件的申辦流程底部點「＋ 加入辦理清單」，整個人生事件就會出現在這裡。<br><br>
    <button class="pbtn primary" style="max-width:180px;margin:0 auto" onclick="go('home')">開始</button></div>`;
  const icon={birth:'images/index-icon01.svg',kg:'images/index-icon02.svg'};
  const evN={birth:'孩子出生',kg:'孩子上幼兒園'};
  return `<div style="font-size:15px;color:#8a8a80;margin:4px 2px 2px">${esc(store.user)}　共 ${L.length} 筆</div>
    <div class="clhint" style="margin:2px 2px 4px">💡 點一筆清單即可逐項勾選；同一個事件可加入多筆。</div>
    <div class="lcards">${L.map(e=>{
      const r=genSteps(e.ev,e.county,e.ans);const total=r.S.length,done=r.S.filter((s,i)=>e.checks[i]).length;
      const pct=total?Math.round(done/total*100):0;const fin=done===total&&total>0;
      return `<div class="lcard2 lc-${e.ev}" onclick="openList('${e.id}')">
        <button class="rm2" onclick="event.stopPropagation();rmList('${e.id}')">刪除</button>
        <div class="row1"><div class="ic"><img src="${icon[e.ev]}" alt=""></div>
          <div><div class="nm">${evN[e.ev]}</div><div class="sub">${esc(e.county||'')}</div></div></div>
        <div class="pbar"><div class="pfill" style="width:${pct}%"></div></div>
        <div class="pt"><span>已完成 ${done}／${total} 項</span>${fin?'<span class="done-badge">✓ 全部完成</span>':'<span>'+pct+'%</span>'}</div>
      </div>`;}).join('')}</div>
    <button class="mutelink" style="margin-top:18px" onclick="logout()">登出</button>`;
}
function scrChecklist(){
  const e=curEntry();
  if(!e){go('tracker');return '';}
  const r=genSteps(e.ev,e.county,e.ans);
  const evName=e.ev==='birth'?'孩子出生':'孩子上幼兒園';
  const total=r.S.length,done=r.S.filter((s,i)=>e.checks[i]).length;
  const pct=total?Math.round(done/total*100):0;
  return `<div class="clhead"><div class="ev">${evName}</div><div class="ct">${esc(e.county||'')}</div></div>
    <div class="clprog"><div class="t"><span id="clProg">已完成 ${done}／${total} 項</span></div>
      <div class="clbarwrap"><div class="clbar" id="clBar" style="width:${pct}%"></div></div></div>
    <div class="clhint">☑️ 勾選左側方框標記完成（淺綠）；點項目看細節會標成淺黃。全部完成會有小驚喜 🎉</div>
    <div class="acc">${r.S.map((s,i)=>stepHTMLCheck(s,i,e)).join('')}</div>
    ${r.skipped.length?`<div class="skipbox"><div class="h">ℹ️ 未列入的項目（原因）</div>${r.skipped.map(x=>`<div class="it">・<b>${esc(x.t)}</b>：${esc(x.r)}</div>`).join('')}</div>`:''}`;
}
function logout(){store.user=null;toast('已登出');go('home');}

/* nav + render */
function nav(){
  const el=document.getElementById('nav');
  const cur=state.screen;
  const btn=(scr,ic,tx,act)=>`<button aria-current="${act}" onclick="go('${scr}')"><span class="i">${ic}</span>${tx}</button>`;
  el.innerHTML = btn('home','🏠','首頁',cur==='home')
    + btn('tracker','📋','辦理清單',cur==='tracker'||cur==='checklist')
    + btn(store.user?'account':'login', store.user?'👤':'🔑', store.user?'我的':'登入', cur==='account'||cur==='login');
}
function render(){
  appbar();
  const m={home:scrHome,wizard:scrWizard,flow:scrFlow,login:scrLogin,tracker:scrTracker,checklist:scrChecklist,account:scrAccount};
  document.getElementById('app').innerHTML=(m[state.screen]||scrHome)();
  nav();
}
render();
</script>
</body>
</html>
