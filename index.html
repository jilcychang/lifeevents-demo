<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的 E 政府 Super App — 互動 Demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:0}
body{font-family:-apple-system,'SF Pro Display','Segoe UI','Microsoft JhengHei',sans-serif;background:#E8E8ED;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;gap:32px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.fade{animation:fadeIn .4s ease}
button{cursor:pointer;font-family:inherit}
.phone{width:375px;height:720px;background:#000;border-radius:44px;padding:10px;box-shadow:0 20px 60px rgba(0,0,0,.25);position:relative;flex-shrink:0}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:28px;background:#000;border-radius:0 0 16px 16px;z-index:10}
.screen{width:100%;height:100%;background:#fff;border-radius:36px;overflow:hidden;display:flex;flex-direction:column}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:6px 20px;font-size:12px;font-weight:600;color:#1A1A1A;flex-shrink:0}
.hbar{display:flex;align-items:center;padding:4px 16px 8px;flex-shrink:0}
.ct{flex:1;overflow-y:auto;background:#F7F7F8}
.bnav{display:flex;justify-content:space-around;align-items:center;height:56px;background:#fff;border-top:1px solid #E5E7EB;flex-shrink:0}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;padding:4px 12px;position:relative}
.badge{position:absolute;top:-4px;right:-4px;background:#EF4444;color:#fff;font-size:9px;font-weight:700;border-radius:10px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.cd{background:#fff;border-radius:14px;padding:16px}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.bp{background:#E8732A;color:#fff;border:none;border-radius:12px;padding:12px 0;font-size:14px;font-weight:600;width:100%;margin-top:12px}
.bd{background:#1A1A1A;color:#fff;border:none;border-radius:12px;padding:12px 0;font-size:14px;font-weight:600;width:100%;margin-top:12px}
.sr{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #E5E7EB}
.sc{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:600}
.side{width:220px;display:flex;flex-direction:column;gap:4px;max-height:720px;overflow-y:auto}
.side h3{font-size:14px;font-weight:700;color:#555;margin-bottom:8px}
.sb{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid #ddd;background:#fff;text-align:left;width:100%}
.sb.on{border:2px solid #E8732A;background:#FFF4ED}
@media(max-width:700px){.side{display:none}body{padding:10px}}
</style>
</head>
<body>
<div class="phone"><div class="notch"></div>
<div class="screen">
  <div class="sbar"><span>09:41</span><span>⚡100%</span></div>
  <div class="hbar" id="hbar" style="display:none">
    <button id="backBtn" style="background:none;border:none;padding:4px;display:flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"><path d="M15 19l-7-7 7-7"/></svg></button>
    <span id="hTitle" style="flex:1;text-align:center;font-size:14px;font-weight:600;color:#1A1A1A"></span>
    <span id="hCount" style="font-size:11px;color:#8A8A8A"></span>
  </div>
  <div class="ct" id="ct"></div>
  <div class="bnav">
    <button><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8732A" stroke-width="1.8" stroke-linecap="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/></svg><span style="font-size:10px;color:#E8732A;font-weight:600">首頁</span></button>
    <button><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="1.8" stroke-linecap="round"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg><span style="font-size:10px;color:#6B7280">服務</span></button>
    <button><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="1.8" stroke-linecap="round"><path d="M3 10h18M7 15h1m4 0h1M7 3h10l4 4v10a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z"/></svg><span style="font-size:10px;color:#6B7280">錢包</span></button>
    <button><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="1.8" stroke-linecap="round"><path d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg><span style="font-size:10px;color:#6B7280">收件匣</span><span class="badge">4</span></button>
    <button><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="1.8" stroke-linecap="round"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg><span style="font-size:10px;color:#6B7280">我的</span></button>
  </div>
</div></div>
<div class="side" id="side"></div>

<script>
var SC=[{id:1,t:"三秒登入",e:"📱",s:"生物辨識一鍵進入"},{id:2,t:"對話搜尋",e:"🔍",s:"AI 助理找服務"},{id:3,t:"新生兒旅程",e:"👶",s:"端到端跨機關串聯"},{id:4,t:"數位憑證",e:"💳",s:"整合數發部 TW DIW"},{id:5,t:"福利推播",e:"🔔",s:"政府主動找民眾"},{id:6,t:"購屋旅程",e:"🏠",s:"一站搞定五項手續"},{id:7,t:"政府收件匣",e:"📬",s:"通知集中不漏接"},{id:8,t:"資料足跡",e:"👁️",s:"透明數據治理"},{id:9,t:"銀行開戶",e:"🔗",s:"第三方服務進駐"},{id:10,t:"多語無障礙",e:"🌏",s:"數位包容設計"},{id:11,t:"服務評分",e:"⭐",s:"民眾回饋驅動改善"},{id:12,t:"退休旅程",e:"🎯",s:"AI 預測式服務"}];
var CHK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M5 13l4 4L19 7"/></svg>';
var cur=0,sub=0;

function go(id){cur=id;sub=0;render();}
function menu(){cur=0;sub=0;render();}
function next(){if(cur<12){cur++;sub=0;}else{cur=0;sub=0;}render();}
function adv(){sub++;render();}

document.getElementById('backBtn').onclick=menu;
document.getElementById('ct').addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');
  if(!b)return;
  var a=b.getAttribute('data-a');
  if(a==='next')next();
  else if(a==='step')adv();
  else if(a==='menu')menu();
  else if(a.indexOf('go:')==0)go(parseInt(a.split(':')[1]));
});
document.getElementById('side').addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');
  if(!b)return;
  var a=b.getAttribute('data-a');
  if(a==='menu')menu();
  else if(a.indexOf('go:')==0)go(parseInt(a.split(':')[1]));
});

function render(){
  document.getElementById('side').innerHTML='<h3>場景列表</h3>'+SC.map(function(s){return '<button class="sb'+(cur===s.id?' on':'')+'" data-a="go:'+s.id+'"><span style="font-size:16px">'+s.e+'</span><div><div style="font-size:11px;font-weight:600;color:#1A1A1A">'+s.id+'. '+s.t+'</div><div style="font-size:9px;color:#8A8A8A">'+s.s+'</div></div></button>';}).join('')+'<button class="sb" data-a="menu" style="margin-top:8px;background:#F4F4F4;justify-content:center;font-size:11px;font-weight:600;color:#8A8A8A">↩ 回到選單</button>';
  var hb=document.getElementById('hbar');
  if(cur===0||(cur===1&&sub>=2)){hb.style.display='none';}else{hb.style.display='flex';document.getElementById('hTitle').textContent=SC[cur-1].t;document.getElementById('hCount').textContent=cur+'/12';}
  document.getElementById('ct').innerHTML=cur===0?renderMenu():renderScene();
}

function renderMenu(){
  return '<div style="padding:16px"><div style="text-align:center;margin-bottom:16px"><h2 style="font-size:18px;font-weight:700;color:#1A1A1A;margin-bottom:2px">我的 E 政府</h2><p style="font-size:12px;color:#8A8A8A">Super App Demo — 12 個亮點場景</p></div>'+SC.map(function(s){return '<div data-a="go:'+s.id+'" style="display:flex;gap:12px;align-items:center;background:#fff;border-radius:12px;padding:12px 14px;cursor:pointer;border:1px solid #E5E7EB;margin-bottom:6px"><div style="width:38px;height:38px;border-radius:10px;background:#FFF4ED;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">'+s.e+'</div><div style="flex:1"><p style="font-size:13px;font-weight:600;color:#1A1A1A">'+s.id+'. '+s.t+'</p><p style="font-size:11px;color:#8A8A8A;margin-top:1px">'+s.s+'</p></div><span style="color:#E5E7EB;font-size:18px">›</span></div>';}).join('')+'</div>';
}

function pl(t,c,b){return '<span class="pill" style="color:'+c+';background:'+(b||'#FFF4ED')+'">'+t+'</span>';}
function dots(n,done){var h='<div style="display:flex;gap:6px;justify-content:center;margin:8px 0 12px">';for(var i=0;i<n;i++)h+='<div style="width:'+(i<=done?20:8)+'px;height:8px;border-radius:4px;background:'+(i<=done?'#E8732A':'#E5E7EB')+';transition:all .3s"></div>';return h+'</div>';}
function journey(steps,done){var h='';for(var i=0;i<steps.length;i++){var ok=i<done,act=i===done,fut=i>done+1;h+='<div class="sr" style="opacity:'+(fut?0.35:1)+'"><div class="sc" style="background:'+(ok?'#10B981':act?'#FFF4ED':'#E5E7EB')+';color:'+(act?'#E8732A':'#8A8A8A')+'">'+(ok?CHK:(i+1))+'</div><span style="font-size:13px;flex:1;color:'+(ok?'#10B981':'#1A1A1A')+';font-weight:'+(act?600:400)+'">'+steps[i]+'</span>'+(ok?pl('已完成','#10B981','#ECFDF5'):'')+(act?pl('進行中','#E8732A','#FFF4ED'):'')+'</div>';}return h;}

function renderScene(){
  var W=function(c){return '<div class="fade" style="padding:16px;min-height:100%">'+c+'</div>';};
  var BP=function(t){return '<button class="bp" data-a="step">'+t+'</button>';};
  var BD=function(t){return '<button class="bd" data-a="next">'+(t||'下一場景 →')+'</button>';};
  var BM=function(t){return '<button class="bd" data-a="menu">'+(t||'回到選單')+'</button>';};

  switch(cur){
  case 1:
    if(sub===0)return '<div class="fade" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,#fff,#FFFBEB);text-align:center;min-height:100%"><div style="font-size:64px;animation:pulse 1s infinite">🔐</div><p style="font-size:14px;color:#8A8A8A;margin-top:16px">臉部辨識驗證中...</p><p style="font-size:12px;color:#ccc;margin-top:24px">（點擊畫面繼續）</p><div data-a="step" style="position:absolute;top:0;left:0;right:0;bottom:56px;cursor:pointer"></div></div>';
    if(sub===1)return '<div class="fade" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,#fff,#FFFBEB);text-align:center;min-height:100%"><div style="width:80px;height:80px;border-radius:50%;background:#ECFDF5;display:flex;align-items:center;justify-content:center;margin-bottom:16px;border:3px solid #10B981"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"><path d="M5 13l4 4L19 7"/></svg></div><h2 style="font-size:22px;margin-bottom:4px;color:#1A1A1A">嗨，小安！</h2><p style="font-size:13px;color:#8A8A8A;margin-bottom:20px">三秒完成登入，歡迎回來</p><button class="bp" data-a="step">進入首頁 →</button></div>';
    // sub>=2: APP Homepage
    return renderHomepage();

  case 2:
    var h='<div style="background:#fff;border-radius:12px;padding:12px;display:flex;align-items:center;gap:8px;margin-bottom:16px"><span style="font-size:18px">🔍</span><span style="flex:1;font-size:14px;color:#1A1A1A">我要辦良民證</span></div><div class="cd" style="border:1px solid #E5E7EB;margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><div style="width:32px;height:32px;border-radius:50%;background:#FFF4ED;display:flex;align-items:center;justify-content:center">🤖</div><span style="font-size:13px;font-weight:600">E-GOV AI 助理</span></div><p style="font-size:13px;color:#1A1A1A;margin-bottom:8px;line-height:1.6">良民證（警察刑事紀錄證明）辦理方式：</p><div style="background:#F7F7F8;border-radius:8px;padding:10px;font-size:12px;color:#6B7280;line-height:1.8"><b style="color:#1A1A1A">申辦資格：</b>年滿14歲國民<br><b style="color:#1A1A1A">所需文件：</b>身分證（已自動帶入）<br><b style="color:#1A1A1A">辦理方式：</b>線上申辦，免臨櫃<br><b style="color:#1A1A1A">預估時間：</b>3 個工作天</div></div>';
    if(sub===0)h+=BP('立即申辦（表單自動填入）');
    else h+='<div class="cd fade" style="border:2px solid #10B981;margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:24px">✅</span><div><p style="font-size:14px;font-weight:600;color:#10B981">已送出申辦！</p><p style="font-size:11px;color:#8A8A8A">姓名、身分證、地址已自動帶入，數位簽章完成</p></div></div></div>'+BD();
    return W(h);

  case 3:{
    var st=["出生登記","健保加保","育兒津貼","生育補助","托育查詢"],h='';
    if(sub===0)return W('<div class="cd" style="border:2px solid #E8732A;cursor:pointer" data-a="step"><div style="display:flex;gap:10px;align-items:center"><div style="width:40px;height:40px;border-radius:50%;background:#FFF4ED;display:flex;align-items:center;justify-content:center;font-size:22px">👶</div><div style="flex:1"><p style="font-size:14px;font-weight:700;color:#1A1A1A">恭喜！偵測到新生兒出生登記</p><p style="font-size:12px;color:#8A8A8A;margin-top:2px">點擊啟動「新生兒報到」旅程</p></div><span style="color:#E8732A;font-size:18px">›</span></div></div>');
    var done=sub-1;
    h+='<h3 style="font-size:16px;font-weight:700;margin-bottom:4px">🍼 新生兒報到旅程</h3><p style="font-size:12px;color:#8A8A8A;margin-bottom:0">5 站一口氣完成</p>';
    h+=dots(5,done)+journey(st,done);
    if(done<5)h+=BP('確認送出「'+st[done]+'」→');
    else h+='<div class="cd fade" style="border:2px solid #10B981;margin-top:12px"><p style="font-size:13px;font-weight:600;color:#10B981">✅ 恭喜完成！預計 3 個工作天核發育兒津貼</p></div>'+BD();
    return W(h);}

  case 4:{
    var h='<h3 style="font-size:16px;font-weight:700;margin-bottom:4px">💳 數位憑證</h3><p style="font-size:11px;color:#8A8A8A;margin-bottom:12px">整合數發部 TW DIW · 選擇性揭露 · 分散式架構</p>';
    // 數位憑證皮夾 - 佔2格寬
    h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">';
    h+='<div class="cd" style="background:linear-gradient(135deg,#FFF4ED,#FFFBEB);padding:14px;grid-column:span 2;display:flex;gap:14px;align-items:center;border:1px solid #F5C842"><div style="width:52px;height:52px;border-radius:16px;background:#E8732A;display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="font-size:26px">💳</span></div><div><p style="font-size:14px;font-weight:700;color:#1A1A1A">數位憑證皮夾</p><p style="font-size:11px;color:#8A8A8A;margin-top:2px">wallet.gov.tw · 數發部官方 APP</p></div></div>';
    h+='<div class="cd" style="background:#EFF6FF;padding:12px"><div style="font-size:28px;margin-bottom:6px">🪪</div><p style="font-size:12px;font-weight:600">行動自然人憑證</p><p style="font-size:10px;color:#8A8A8A;margin-top:2px">TW FidO 已綁定</p></div>';
    h+='<div class="cd" style="background:#ECFDF5;padding:12px"><div style="font-size:28px;margin-bottom:6px">📱</div><p style="font-size:12px;font-weight:600">電信門號電子卡</p><p style="font-size:10px;color:#8A8A8A;margin-top:2px">遠傳電信 已驗證</p></div>';
    h+='</div><p style="font-size:13px;font-weight:600;color:#8A8A8A;margin-bottom:8px">📄 我的電子文件</p>';
    ["電子戶籍謄本","出生證明","育兒津貼核定函"].forEach(function(d){h+='<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #E5E7EB"><span style="color:#E8732A">📄</span><span style="font-size:12px;flex:1">'+d+'</span><span style="color:#E5E7EB">›</span></div>';});
    h+='<div style="margin-top:12px;background:#FFFBEB;border-radius:10px;padding:10px 12px;font-size:11px;color:#8A8A8A;line-height:1.6"><b style="color:#1A1A1A">選擇性揭露：</b>超商領包裹只出示姓名與照片，無需揭露身分證字號等多餘個資</div>';
    if(sub===0)h+=BP('模擬超商取貨驗證');
    else h+='<div class="cd fade" style="border:2px solid #10B981;margin-top:12px"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:24px">✅</span><div><p style="font-size:14px;font-weight:600;color:#10B981">驗證完成！</p><p style="font-size:11px;color:#8A8A8A">已出示 QR Code，店員掃碼確認身分，包裹領取成功</p></div></div></div>'+BD();
    return W(h);}

  case 5:{
    var h='<div class="cd" style="background:#FFF4ED;border:1px solid #E8732A;margin-bottom:16px"><p style="font-size:14px;font-weight:700;color:#E8732A">🔔 您的孩子即將滿 2 歲！</p><p style="font-size:12px;color:#8A8A8A;margin-top:4px">系統偵測到以下 3 項福利您可能符合資格</p></div>';
    [{i:"💰",t:"2~6 歲育兒津貼加碼",d:"每月可領 $7,000",tg:"符合資格",tc:"#E8732A",bg:"#FFF4ED"},{i:"🏫",t:"公立幼兒園登記",d:"附近 3 所園所可選",tg:"即將截止",tc:"#EF4444",bg:"#FEF2F2"},{i:"📋",t:"幼兒特別扣除額",d:"報稅可扣 $120,000",tg:"溫馨提醒",tc:"#E8732A",bg:"#FFF4ED"}].forEach(function(b){h+='<div class="cd" style="margin-bottom:10px;border:1px solid #E5E7EB"><div style="display:flex;gap:10px"><span style="font-size:28px">'+b.i+'</span><div style="flex:1"><div style="display:flex;gap:6px;align-items:center;margin-bottom:2px"><span style="font-size:13px;font-weight:600">'+b.t+'</span>'+pl(b.tg,b.tc,b.bg)+'</div><p style="font-size:11px;color:#8A8A8A">'+b.d+'</p></div></div></div>';});
    h+=BD();
    return W(h);}

  case 6:{
    var st=["房屋稅籍設定","自用住宅稅率","地址變更","水電過戶提醒","學區查詢"],h='<h3 style="font-size:16px;font-weight:700;margin-bottom:4px">🏠 購屋旅程</h3><p style="font-size:12px;color:#8A8A8A;margin-bottom:16px">地址只需填一次，自動帶入所有表單</p>';
